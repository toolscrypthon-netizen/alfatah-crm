# Runs the CRM and its own PostgreSQL database. The web app only listens on
# 127.0.0.1, so it is reachable through the reverse proxy on the VPS and not
# directly from the internet. Change CRM_PORT if 8010 is already taken.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD}@db:5432/crm
    volumes:
      - media:/app/media
    ports:
      - "127.0.0.1:${CRM_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
